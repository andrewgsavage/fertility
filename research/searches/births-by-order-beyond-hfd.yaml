id: births-by-order-beyond-hfd
question: >-
  Births or fertility rates by birth order (ideally by mother's age, annual) for countries and years
  the Human Fertility Database lacks: countries with no HFD birth-order series (France, Greece,
  Latvia, Romania, Australia, Israel, Mexico, Singapore and others) and earlier years where the HFD
  series starts late (UK 2013, Belgium and Switzerland 1998, Italy 2004).
status: open
answer: >-
  Greece 1960-2024 (HFC estimates to 1991, Eurostat births by order over women from 1992) and
  Mauritius 2005-2024 (HFC) TFR by order and first- and second-birth rates per woman at risk
  (cohort-cumulated) are on the first vs second birth, motherhood probability and country
  comparison pages. Mexico 1990-2024 (INEGI registrations, completed for late registration) and Brazil 2000-2024
  (SINASC) TFR by birth order are on the FT birth-rates page. Brazil's first- and second-birth
  rates per woman at risk, with parity from cohort-cumulated order rates, are on the first vs
  second birth page. Mexico's registers give more than one first birth per woman over a cohort,
  so no conditional rates for Mexico. Eurostat demo_fordagec gives births by order and single-year age for
  about 50 European countries, and the Human Fertility Collection has order-specific ASFRs for about
  ten countries missing from HFD. Both give order-specific rates per woman, not parity-conditional
  rates, because neither has exposure by parity.
measurables: [births, asfr, tfr]
countries: [FRA, GRC, LVA, ROU, CYP, LUX, MLT, SRB, MKD, ALB, MDA, GEO, ARM, TUR, MUS, CUB, HKG, AUS, ISR, MEX, SGP, BRA, NZL]
attempts:
  - date: 2026-11-26
    tried: Eurostat demo_fordagec (live births by mother's age and birth order), JSON API
    url: https://ec.europa.eu/eurostat/databrowser/view/demo_fordagec/default/table
    outcome: partial
    why: >-
      Has single-year age by order 1, 2, 3, 4+ with under 2% unknown order for most countries.
      Not in HFD: Greece, Latvia, Romania, Cyprus and Luxembourg (1960 or 1980s-2024), Malta
      2005-2024, Serbia 2000-2024, North Macedonia, Georgia, Armenia, Moldova (up to 15% unknown),
      Albania (gappy, up to 11% unknown), Türkiye 2018-2024 (gappy). France is 1998-2024 with
      2007-2012 missing. UK series is 1960-2018, but UK order before 2013 counted only births within
      the current marriage, which is why HFD starts in 2013. Early years for Belgium, Switzerland and
      Italy may have the same within-marriage coding. Births only, so rates need demo_pjan
      populations, and there is no exposure by parity.
