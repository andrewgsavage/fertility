next:
  - Colombia DANE EEVV, Chile INE and Costa Rica INEC vital-statistics microdata (previous live births per birth).
  - Japan and Taiwan are already in HFD; Thailand and Malaysia registration data not checked.
  - INED for a corrected French TFR by order.
notes: >-
  HFD derives parity-conditional rates from births by order plus census parity distributions, so
  Eurostat or HFC counts support order-specific ASFR/TFR (TFR1, TFR2, ...) and mean age by order, but
  not the conditional rates or the motherhood-probability calculation without extra work.
