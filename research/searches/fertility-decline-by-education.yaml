id: fertility-decline-by-education
question: >-
  Period fertility (TFR or age-specific / first-birth rates) by women's education level (low,
  medium, high), before and after the post-2010 decline, for several countries, to see whether
  the fall was concentrated among primary/secondary-educated women.
status: partial
answer: >-
  No harmonised cross-country rate series found. Register studies: Norway (Beck, Hellstrand &
  Myrskylä 2024) finds the 2010-2018 TFR fall among women was driven most by the highest
  educated, with cohort fertility falling most among the lower educated; Finland (Hellstrand,
  Nisén & Myrskylä 2022/2024) finds similar TFR falls across levels, first-birth falls somewhat
  larger for secondary and lower tertiary, and much larger variation by field; Statistics Finland
  gives 2023 TFR of 0.94 (basic), 1.04 (upper secondary), 1.59 (master's+), with the 2022-23 fall
  smallest for the tertiary group. US (Kearney, Levine & Pardue 2022) describes similar trends
  with and without a degree. Uruguay (already on the education page) fell most among the least
  educated. Built here: US ACS PUMS rates by education 2008-2024 (graduates fell most at 25-44;
  most of the US fall is under 25) and Eurostat demo_faeduc / lfsa_pgaed rates at 25-44 with
  breaks flagged; NCHS birth certificates over ACS women (2017-2024); CPS children ever born and
  childlessness by age and education (2016-2024); Nordic register births over register women by
  education (FI, SE, DK, NO); Estonia register births, women and children ever born by education; DHS TFR by education for ~55 countries with a within/composition
  split. All on the education page.
factors: [education]
measurables: [tfr, asfr, cond-asfr-1, births]
countries: [NOR, FIN, SWE, DNK, EST, USA, URY, all]
pages: [docs/factors/education.md]
attempts:
  - date: 2026-11-27
    tried: Eurostat demo_faeduc (live births by mother's age and ISCED level), SDMX-CSV API, divided by LFS lfsa_pgaed women by age and ISCED
    url: https://ec.europa.eu/eurostat/databrowser/view/demo_faeduc/default/table
    outcome: partial
    why: >-
      Used on the education page with breaks flagged (year-on-year change over 20% in any group).
      Births downloads by script (single years of age, 2007-2024, ~20 countries with long series;
      5-year age bands only 2013-2019, so sum single years). But births come from registers and
      the population from the LFS survey, and the resulting rates have level breaks that are
      classification changes, not behaviour - Sweden ED0-2 jumps 1.25 to 1.82 (25-44 partial TFR)
      in 2013, Finland ED0-2 falls 2.10 to 0.53 over 2020-2022, Norway ED3_4 dips in 2017-2019.
      Unknown education is up to 40% (Spain) in early years. Not usable for trends by education
      without per-country break checks.
