next:
  - UK: 2011 census safeguarded microdata (UKDS) for the 2021 cross; Scotland's census 2011/2022 tables.
  - Taiwan: pre-2016 births by mother's education from the MOI statistical yearbook.
  - Chile: INE vital statistics yearbook tables of births by mother's age and education, over CASEN women.
  - Comolli et al. 2020/2021 Nordic first-birth decline by education (Sweden, Norway, Finland, Denmark).
  - Ohlsson-Wijk & Andersson 2022 (Sweden, first births by labour-market attachment and education).
  - StatFin table with TFR by education, 2010 onward.
notes: >-
  Education gaps at 20-29 partly reflect women still studying, so compare 25-44 or completed
  fertility. Period and cohort results can differ: in Norway the period fall was largest among
  graduates (postponement) while the cohort fall was largest among the lower educated.
