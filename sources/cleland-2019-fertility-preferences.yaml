  basis: fulltext
  ref: research/factor-evidence/fulltext-sweep.md
  note: 'pooled: Stated stop-preferences are implemented better where contraceptive use is high, so births
    among women wanting no more fall; weak implementation is the main cause of preference-behaviour gaps.'
