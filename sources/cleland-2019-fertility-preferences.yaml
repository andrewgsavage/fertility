notes: 'Cited in stone-2023-not-having-baby (Cardus) for: preferences predict later fertility, and near-term
  (two-year) expectations are fairly accurate projections. Online 2019; issue 74(1), 2020. The report
  misnames the journal as Journal of Population Studies. Published in Population Studies.'
