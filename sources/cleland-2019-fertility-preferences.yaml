findings:
- factor: ideal-family-size
  measure: cond-asfr-2plus
  verdict: mixed
  tick: '?'
  basis: fulltext
  ref: sources/cleland-2019-fertility-preferences.yaml
  note: 'Synthesis of longitudinal studies in 28 Asian and African populations: a baseline desire to stop
    childbearing predicts lower subsequent fertility in every population, more strongly where contraceptive
    use is higher; a desire to delay does not consistently predict fertility. Preferences and behaviour
    often diverge (weak contraceptive implementation, unstable preferences). Points toward a tick for
    higher-order births, in high- and middle-fertility settings.'
