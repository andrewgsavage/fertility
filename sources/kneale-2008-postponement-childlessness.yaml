  note: 'British cohorts born 1958 (NCDS) and 1970 (BCS70): first births postponed sharply (childless
    at 34 rose, e.g. graduate women 39% to 56%), but projected final childlessness of 1970-born graduate
    women is about a quarter, not the 40% conjectured. Postponement raised childlessness less than feared:
    consistent with the blank.'
