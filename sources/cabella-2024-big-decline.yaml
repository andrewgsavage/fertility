notes: TFR fell from 2.0 in 2015 to 1.37 in 2021 (1.28 preliminary for 2022). Table A-1 splits the 2015-2021 fall by age group and birth order (first 40.7%, second 30.6%, third 14.2%, fourth+ 14.4%). Figure 5 (conditional first-birth rates by single age, 2016-2021) is digitised in research/data; the paper publishes no data file. Births from the Live Birth Certificate and Perinatal Information System, exposures from INE 2013-revision projections with parity from the 2011 census.
