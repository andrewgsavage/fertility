  ref: sources/garcia-manglano-2014-gender-time-use.yaml
  note: 'Review plus cross-country time diaries (MTUS, 8 countries, 2000-04, partnered parents 20-59):
    in near-replacement countries (US, Norway, Denmark, Finland) men do over half as much housework as
    women; in lowest-low countries (Germany, Japan, Italy, Spain) under half, with little difference in
    childcare time. TFR recovered in the US and Norway after the men/women domestic-work ratio passed
    ~0.5. Descriptive, outcome is TFR; the review cites household studies linking equal division to second
    births.'
