  note: 'pooled: Cross-country association between men''s share of housework and TFR; US and Norway recovered
    TFR after the men/women domestic-work ratio passed about 0.5 (Figure 2). Outcome is period TFR, not
    parity progression; childcare ratios differ little (0.41-0.52 excluding Japan 0.17).'
