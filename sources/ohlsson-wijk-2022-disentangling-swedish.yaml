  note: 'Sweden, registers 1991-2018, Swedish-born men and women 16-45: first-birth rates fell in the 2010s
    in every labour-market group, most in relative terms among non-participants, then the unemployed and
    lowest earners, least among high earners, so the gap by labour-market position widened; men and women
    alike. But the shares unemployed or studying fell and high earners rose, so a growing left-behind group
    did not drive the decline. Own position only, not partners''; results shown in charts only (Fig. 4).'
