notes: Live births by single year of mother's age, 1996-2021 (natality table 3), and SIP public microdata for 2013 and 2021 (previous deliveries by 5-year maternal age group). The ministry's site refuses access from outside Uruguay; files are read from Internet Archive copies (February 2023). SIP covers 97% of births in 2013 and 94% in 2021.
