findings:
- factor: age-at-first-birth
  measure: cond-asfr-2plus
  verdict: mixed
  tick: 'yes'
  basis: fulltext
  ref: research/factor-evidence/fulltext-recheck.md
  note: 'European Social Survey, 23 countries: second-birth rates are highest when the first birth came
    at the locally ''expected'' age (under 25 near the Hajnal line, 25-30 further west), so later first
    births do not uniformly lower second births; the authors favour norms over the biological clock.'
- factor: education
  measure: cond-asfr-2plus
  verdict: mixed
  tick: 'no'
  basis: fulltext
  ref: research/factor-evidence/fulltext-recheck.md
  note: 'As above: the education gradient in second births varies by country; where many young children
    are in formal childcare, highly educated women have much higher second-birth rates.'
- factor: age-at-first-birth
  measure: ppr-1-2plus
  verdict: mixed
  tick: '?'
  direction: mixed
  basis: fulltext
  ref: research/factor-evidence/fulltext-sweep.md
  note: 'pooled: Postponement penalty on second births is much larger for low-educated women: first birth
    at 35, about 45% of high-educated vs 25% of low-educated have a second birth within 5 years. Authors
    note partly selection (late low-educated mothers more often subfecund). Second-birth hazard, not completed
    PPR.'
- factor: childcare-provision
  measure: cond-asfr-2plus
  verdict: supports
  tick: '?'
  direction: +
  basis: fulltext
  ref: research/factor-evidence/fulltext-sweep.md
  note: 'pooled: Country day-care enrolment (age 0-2, c. 2004) goes with higher second-birth rates among
    high-educated women but not low-educated (16 countries). Enrolment is a crude proxy of provision;
    endogeneity acknowledged, not causal.'
- factor: childcare-provision
  measure: ppr-1-2plus
  verdict: supports
  tick: '?'
  direction: +
  basis: fulltext
  ref: research/factor-evidence/fulltext-sweep.md
  note: 'pooled: Same result; authors say child care lowers the opportunity cost of parity progression
    for the highly educated. Second-birth hazard within 5 years, not completed PPR.'
