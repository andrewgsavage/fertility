publisher: International Labour Organization (ILOSTAT)
url: https://rplumber.ilo.org/data/indicator/?id=POP_XWAP_SEX_AGE_MTS_NB_A&format=.csv.gz
oa: gold
local:
- ILO/data/
countries:
- all
