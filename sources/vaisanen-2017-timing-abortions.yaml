  note: 'FIN: Of ever-pregnant women 4.7% had abortions only and 12.2% had abortion(s) then birth(s):
    abortion delays far more often than it ends childbearing. Having had an abortion carries 20% higher
    odds of a later conception leading to birth (OR 1.20), not lower. 23% of women ever had an abortion.'
- factor: abortion
  measure: young-first-births
  verdict: mixed
  tick: '?'
  direction: mixed
  basis: fulltext
  ref: research/factor-evidence/fulltext-sweep.md
  note: 'FIN: Abortions occur at younger ages than births (mean 25.8 vs 29.5) and 45.8% of abortions are
    to women with low education at the time (vs 16.9% of births); low education raises abortion odds (OR
    1.40) and lowers birth odds (OR 0.90). Parity-specific first-birth effects of abortion not estimated.'
