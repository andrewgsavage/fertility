- factor: income
  measure: cond-asfr-1
  verdict: supports
  tick: 'yes'
  direction: +
  basis: fulltext
  ref: sources/stone-2023-not-having-baby.yaml
  note: 'Canada 2022 (Angus Reid, 2,700 women 18-44): ideal and intended family size both rise with household
    income, and the gap between them is largest for the poorest women. Among under-30s who want more children,
    low income cuts the two-year birth expectation by 13.6 points (5.3 adjusted) and inability to pay for basic
    needs by 15.0 (5.0). Children ever born: poorer women have more under 30, no gradient in the 30s, richer
    women more by 40-44 (Figs 7-9). Cross-sectional.'
- factor: ideal-family-size
  verdict: mixed
  tick: '?'
  direction: mixed
  basis: fulltext
  ref: sources/stone-2023-not-having-baby.yaml
  note: 'Canada 2022 (Angus Reid, 2,700 women 18-44): desired family size ~2.2 and intended ~1.85, the lowest
    of 26 Canadian surveys since 1945, so ideals have fallen; but both sit well above the TFR of 1.4, and at
    40-44 45% have fewer children than their ideal versus 14% more (about 0.5 children short on average). Falling
    ideals explain part of the decline; most of the gap is unrealised desires.'
- factor: female-infertility
  measure: ppr-0-1
  verdict: no-evidence
  tick: 'yes'
  direction: '0'
  basis: fulltext
  ref: sources/stone-2023-not-having-baby.yaml
  note: 'Canada 2022 (Angus Reid, 2,700 women 18-44): few respondents at any age gave infertility or poor health
    as a reason for not having (more) children, and one wrote in IVF availability. Stated reasons only; no
    measure of realised childlessness.'
notes: 'Angus Reid survey of 2,700 Canadian women aged 18-44 (July 2022): intended family size ~1.85 and desired
  ~2.2, both the lowest of 26 Canadian surveys back to 1945, against a TFR of 1.4. Among women aged 40-44,
  45% have fewer children than their ideal versus 14% more, about 0.5 children short on average. Among under-30s
  who want children, life-stage sequencing (self-development, career first) predicts delay more strongly than
  housing or childcare costs; fertility desires and intentions rise with income. PDF: https://www.cardus.ca/wp-content/uploads/2023/01/Shes-Not-Having-a-Baby.pdf'
