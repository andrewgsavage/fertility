notes: >-
  DNBR<year>.dbc, one file per year of birth, compressed DBF (PKWARE implode), expanded with
  common/dbc2dbf.c. Birth order = QTDFILVIVO (previous live-born children) + 1. The FTP data
  connection times out often; retries get through. TabNet has no previous-children variable.
