[project]
authors = ["Andrew <andrewgsavage@gmail.com>"]
channels = ["conda-forge"]
name = "fertility"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
# Rerun every <SOURCE>/scripts entry point (optionally only some folders: `pixi run outputs ONS HFD`).
outputs = "python -m common.run_all"
docs-build = "sphinx-build -b html docs docs/_build/html"
# Ignore files that builds and editors write into docs/ (generated _static/<name>/
# copies, __pycache__, editor temp files) so they don't trigger a rebuild + page reload.
docs-serve = "sphinx-autobuild docs docs/_build/html --watch sources --re-ignore '/docs/_static/[^/]+/' --re-ignore '__pycache__' --re-ignore '(~|\\.swp|\\.tmp)$'"
sources-check = "python sources/sources.py"
sources-fetch = "python sources/fetch_fulltexts.py"

[dependencies]
pandas = ">=2.3.1,<3"
pint-pandas = ">=0.7.1,<0.8"
pixi-kernel = ">=0.6.4,<0.7"
jupyter = ">=1.1.1,<2"
requests = ">=2.31.0,<3"
beautifulsoup4 = ">=4.13.3,<5"
html-to-markdown = ">=2.16,<3"
matplotlib = ">=3.8.2,<4"
pillow = "*"
plotly = "*"
openpyxl = ">=3.1,<4"
tabulate = ">=0.9,<0.10"
playwright = ">=1.61.1,<2"
sphinx = ">=7"
furo = "*"
myst-parser = "*"
sphinx-design = "*"
python-kaleido = ">=1.3.0,<2"
sphinx-autobuild = "*"
xlrd = ">=2.0.2,<3"
pyyaml = ">=6.0.3,<7"
pypdf = ">=7.1.1,<8"
odfpy = ">=1.4.1,<2"
truststore = ">=0.10.5,<0.11"

# Repo root on the import path, so scripts in any folder can `from common import ...`
# whatever the working directory. Activation runs in cmd on win-64 and bash on linux-64.
[target.win-64.activation.env]
PYTHONPATH = "%PIXI_PROJECT_ROOT%"

[target.linux-64.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"
