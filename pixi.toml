[project]
authors = ["Andrew <andrewgsavage@gmail.com>"]
channels = ["conda-forge"]
name = "fertility"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
docs-build = "sphinx-build -b html docs docs/_build/html"
# Ignore files that builds and editors write into docs/ (generated _static/<name>/
# copies, __pycache__, editor temp files) so they don't trigger a rebuild + page reload.
docs-serve = "sphinx-autobuild docs docs/_build/html --re-ignore '/docs/_static/[^/]+/' --re-ignore '__pycache__' --re-ignore '(~|\\.swp|\\.tmp)$'"
sources-check = "python sources/sources.py"

[dependencies]
pandas = ">=2.3.1,<3"
pint-pandas = ">=0.7.1,<0.8"
pixi-kernel = ">=0.6.4,<0.7"
jupyter = ">=1.1.1,<2"
requests = ">=2.31.0,<3"
beautifulsoup4 = ">=4.13.3,<5"
html-to-markdown = ">=2.16,<3"
matplotlib = ">=3.8.2,<4"
pillow = "*"
plotly = "*"
openpyxl = ">=3.1,<4"
tabulate = ">=0.9,<0.10"
playwright = ">=1.61.1,<2"
sphinx = ">=7"
furo = "*"
myst-parser = "*"
sphinx-design = "*"
python-kaleido = ">=1.3.0,<2"
sphinx-autobuild = "*"
xlrd = ">=2.0.2,<3"
pyyaml = ">=6.0.3,<7"
